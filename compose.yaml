services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worktrack360
      POSTGRES_USER: worktrack
      POSTGRES_PASSWORD: worktrack-dev-only
    ports:
      - "5432:5432"
    volumes:
      - worktrack360_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worktrack -d worktrack360"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://worktrack:worktrack-dev-only@db:5432/worktrack360
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped

volumes:
  worktrack360_db:
